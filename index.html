<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عبد الله قرينات - بوابة الشحن والمحفظة</title>
    <!-- مكتبة Supabase للربط -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: white;
            transition: background 0.3s;
        }
        .btn-signup {
            background-color: #27ae60;
        }
        .btn-signup:hover {
            background-color: #219653;
        }
        .btn-signin {
            background-color: #2980b9;
        }
        .btn-signin:hover {
            background-color: #1f618d;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            margin: 25px 0;
        }
        #auth-status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        #wallet-section {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>متجر عبد الله قرينات</h2>

        <!-- قسم تسجيل الحسابات -->
        <div id="auth-forms">
            <!-- نموذج إنشاء حساب جديد -->
            <div id="signup-box">
                <h3 style="color: #27ae60; font-size: 18px;">إنشاء حساب جديد</h3>
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="su-name" placeholder="أدخل اسمك">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="su-email" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="su-pass" placeholder="6 رموز على الأقل">
                </div>
                <button class="btn-signup" onclick="handleSignUp()">تسجيل وإنشاء الحساب</button>
            </div>

            <hr>

            <!-- نموذج تسجيل الدخول -->
            <div id="signin-box">
                <h3 style="color: #2980b9; font-size: 18px;">تسجيل الدخول للمحفظة</h3>
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="si-email" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="si-pass" placeholder="كلمة السر الخاصة بك">
                </div>
                <button class="btn-signin" onclick="handleSignIn()">دخول للمحفظة</button>
            </div>
        </div>

        <!-- واجهة المحفظة والشحن (تظهر بعد الدخول الناجح) -->
        <div id="wallet-section">
            <h3 style="color: #e67e22;">مرحباً بك في محفظتك الشخصية</h3>
            <p>تم تسجيل دخولك بنجاح إلى متجر عبد الله قرينات.</p>
            <p style="font-size: 18px; background: #e8f8f5; padding: 10px; border-radius: 5px;">رصيد المحفظة الحالي: <span id="balance" style="color: #27ae60; font-weight: bold;">0.00</span> دولار</p>
            <button onclick="handleLogout()" style="background: #c0392b; margin-top: 10px;">تسجيل الخروج</button>
        </div>

        <p id="auth-status"></p>
    </div>

    <!-- كود برمجة السكربت والاتصال بقاعدة البيانات -->
    <script>
        // إعدادات الاتصال بـ Supabase الخاصة بك
        const SUPABASE_URL = 'https://npuljhidfkrznkxhslsy.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_6gycigSkV72C6wFNN_BrVg_CR8KRadd';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // دالة إنشاء الحساب
        async function handleSignUp() {
            const name = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const password = document.getElementById('su-pass').value.trim();
            const statusEl = document.getElementById('auth-status');

            if (!name || !email || !password) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'الرجاء ملء جميع الحقول بصورة صحيحة!';
                return;
            }

            statusEl.style.color = 'orange';
            statusEl.innerText = 'جاري إنشاء الحساب وإرسال بيانات التسجيل...';

            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { full_name: name } }
            });

            if (error) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'خطأ في الإنشاء: ' + error.message;
            } else {
                statusEl.style.color = 'green';
                statusEl.innerText = 'تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول مباشرة.';
            }
        }

        // دالة تسجيل الدخول
        async function handleSignIn() {
            const email = document.getElementById('si-email').value.trim();
            const password = document.getElementById('si-pass').value.trim();
            const statusEl = document.getElementById('auth-status');

            if (!email || !password) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'الرجاء إدخال البريد وكلمة السر!';
                return;
            }

            statusEl.style.color = 'orange';
            statusEl.innerText = 'جاري التحقق وتسجيل الدخول...';

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'فشل الدخول: تأكد من صحة البريد أو كلمة السر!';
            } else {
                statusEl.style.color = 'green';
                statusEl.innerText = 'تم تسجيل الدخول بنجاح!';
                
                // الانتقال لواجهة المحفظة فوراً
                setTimeout(() => {
                    document.getElementById('auth-forms').style.display = 'none';
                    document.getElementById('wallet-section').style.display = 'block';
                    statusEl.innerText = '';
                }, 800);
            }
        }

        // دالة تسجيل الخروج
        async function handleLogout() {
            await _supabase.auth.signOut();
            document.getElementById('wallet-section').style.display = 'none';
            document.getElementById('auth-forms').style.display = 'block';
            document.getElementById('auth-status').style.color = 'blue';
            document.getElementById('auth-status').innerText = 'تم تسجيل الخروج بنجاح.';
        }
    </script>
</body>
</html>
