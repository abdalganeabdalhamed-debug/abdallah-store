<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الله قرينان - متجر الشحن</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #38ef7d;
        }

        input, button {
            padding: 12px;
            margin: 8px 0;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            outline: none;
        }

        input {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
        }

        input:focus {
            border-color: #38ef7d;
        }

        button {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #38ef7d;
            color: #38ef7d;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            background-color: rgba(56, 239, 125, 0.1);
        }

        .hidden { display: none; }

        .product-card {
            border: 1px solid #3d3d3d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: #2a2a2a;
            text-align: right;
        }

        .wallet-box {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #111;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: right;
        }

        .link-text {
            color: #38ef7d;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
            display: block;
            font-size: 14px;
        }
        .link-text:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>عبد الله قرينان</h1>

    <!-- قسم تسجيل الدخول -->
    <div id="login-section">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني">
        <input type="password" id="login-password" placeholder="كلمة المرور">
        <button onclick="loginUser()">تسجيل الدخول</button>
        <p id="login-msg" style="color: #ff4d4d; font-size: 14px;"></p>
        <span class="link-text" onclick="showSignup()">ليس لديك حساب؟ اضغط هنا لإنشاء حساب جديد</span>
    </div>

    <!-- قسم إنشاء حساب جديد -->
    <div id="signup-section" class="hidden">
        <h2>إنشاء حساب جديد</h2>
        <input type="text" id="signup-name" placeholder="الاسم الكامل">
        <input type="email" id="signup-email" placeholder="البريد الإلكتروني">
        <input type="password" id="signup-password" placeholder="كلمة المرور">
        <button onclick="signupUser()" style="background: #007bff;">تأكيد إنشاء الحساب</button>
        <p id="signup-msg" style="color: #ff4d4d; font-size: 14px;"></p>
        <button class="secondary-btn" onclick="showLogin()">العودة لتسجيل الدخول</button>
    </div>

    <!-- قسم المتجر والمنتجات (يظهر بعد تسجيل الدخول الناجح) -->
    <div id="store-section" class="hidden">
        <div class="wallet-box">
            مرحباً، <span id="user-name-display"></span><br>
            البريد: <span id="user-email-display"></span><br>
            رصيد المحفظة: $<span id="user-balance">0.00</span>
            <button onclick="logout()" style="background-color: #dc3545; width: auto; padding: 6px 12px; margin-top: 10px;">تسجيل خروج</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">

        <h2>قائمة المنتجات</h2>

        <div id="products-list">
            <div class="product-card">
                <h3>فري فاير (Free Fire)</h3>
                <p style="color: #aaa; font-size: 13px;">شحن 2000 جوهرة</p>
                <p style="font-weight: bold; color: #38ef7d; margin: 5px 0;">السعر: $100.00</p>
                <button onclick="buyItem(100)">شراء المنتج</button>
            </div>
            <div class="product-card">
                <h3>تيك توك (TikTok)</h3>
                <p style="color: #aaa; font-size: 13px;">شحن 1000 عملة</p>
                <p style="font-weight: bold; color: #38ef7d; margin: 5px 0;">السعر: $50.00</p>
                <button onclick="buyItem(50)">شراء المنتج</button>
            </div>
            <div class="product-card">
                <h3>ببجي (PUBG Mobile)</h3>
                <p style="color: #aaa; font-size: 13px;">شحن 2000 شدة</p>
                <p style="font-weight: bold; color: #38ef7d; margin: 5px 0;">السعر: $120.00</p>
                <button onclick="buyItem(120)">شراء المنتج</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jsptynjktxfetyxebwvo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xCxX3NCHHcnTWywv9eudZg_mAfImIYD';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    function showSignup() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('signup-section').classList.remove('hidden');
        document.getElementById('login-msg').innerText = '';
    }

    function showLogin() {
        document.getElementById('signup-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('signup-msg').innerText = '';
    }

    async function signupUser() {
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value.trim();
        const msgEl = document.getElementById('signup-msg');

        if (!name || !email || !password) {
            msgEl.innerText = 'الرجاء ملء جميع الحقول المطلوبة';
            return;
        }

        // الرصيد الابتدائي يبدأ بصفر (0.00) بناءً على طلبك
        const { error } = await supabaseClient
            .from('store_users')
            .insert([{ name: name, email: email, password: password, balance: 0.00 }]);

        if (error) {
            msgEl.innerText = 'خطأ في إنشاء الحساب (البريد مستخدم مسبقاً)';
            console.error(error);
        } else {
            alert('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.');
            showLogin();
        }
    }

    async function loginUser() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const msgEl = document.getElementById('login-msg');

        if (!email || !password) {
            msgEl.innerText = 'الرجاء إدخال البريد وكلمة المرور';
            return;
        }

        const { data, error } = await supabaseClient
            .from('store_users')
            .select('*')
            .eq('email', email)
            .eq('password', password)
            .single();

        if (error || !data) {
            msgEl.innerText = 'خطأ: البريد أو كلمة المرور غير صحيحة';
        } else {
            currentUser = data;
            enterStore();
        }
    }

    function enterStore() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('signup-section').classList.add('hidden');
        document.getElementById('store-section').classList.remove('hidden');
        document.getElementById('user-name-display').innerText = currentUser.name;
        document.getElementById('user-email-display').innerText = currentUser.email;
        document.getElementById('user-balance').innerText = Number(currentUser.balance).toFixed(2);
    }

    function logout() {
        currentUser = null;
        document.getElementById('store-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('login-email').value = '';
        document.getElementById('login-password').value = '';
    }

    async function buyItem(price) {
        if (Number(currentUser.balance) < price) {
            alert('رصيدك غير كافي لإتمام الشراء! يرجى شحن حسابك.');
            return;
        }

        const newBalance = Number(currentUser.balance) - Number(price);

        const { error } = await supabaseClient
            .from('store_users')
            .update({ balance: newBalance })
            .eq('id', currentUser.id);

        if (error) {
            alert('حدث خطأ أثناء عملية الشراء');
            console.error(error);
        } else {
            currentUser.balance = newBalance;
            document.getElementById('user-balance').innerText = Number(currentUser.balance).toFixed(2);
            alert('تمت عملية الشراء بنجاح!');
        }
    }
</script>

</body>
</html>
