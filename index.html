<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عبد الله قرينات - المحفظة الآمنة</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #b0b0b0;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #444;
            background-color: #2b2b2b;
            color: #ffffff;
            border-radius: 6px;
            font-size: 14px;
            text-align: right;
        }
        input:focus {
            border-color: #27ae60;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: white;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-main { background-color: #27ae60; }
        .btn-logout { background-color: #c0392b; margin-top: 15px; }
        #wallet-section {
            display: none;
            text-align: center;
        }
        .balance-box {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            margin: 20px 0;
            font-size: 18px;
        }
        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>متجر عبد الله قرينات</h2>

        <!-- واجهة التسجيل والدخول المباشر -->
        <div id="auth-box">
            <div class="form-group">
                <label>اسم المستخدم أو البريد:</label>
                <input type="text" id="username" placeholder="أدخل اسمك أو بريدك">
            </div>
            <div class="form-group">
                <label>كلمة السر:</label>
                <input type="password" id="password" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn-main" onclick="openWallet()">دخول / إنترنت مباشر للمحفظة</button>
        </div>

        <!-- واجهة المحفظة والرصيد -->
        <div id="wallet-section">
            <h3 style="color: #e67e22;">مرحباً بك، <span id="user-display" style="color: #fff;"></span></h3>
            <div class="balance-box">
                رصيد المحفظة الحالي: <br><span id="balance-display" style="color: #27ae60; font-weight: bold; font-size: 24px;">0.00</span> دولار
            </div>
            <p style="font-size: 13px; color: #aaa;">يمكنك تعديل رصيدك وإدارته بكل سهولة.</p>
            <button class="btn-logout" onclick="logoutWallet()">تسجيل الخروج</button>
        </div>

        <p id="status-msg"></p>
    </div>

    <script>
        function openWallet() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const status = document.getElementById('status-msg');

            if (!user || !pass) {
                status.style.color = '#ff6b6b';
                status.innerText = 'الرجاء ملء جميع الحقول!';
                return;
            }

            status.style.color = '#f1c40f';
            status.innerText = 'جاري فتح المحفظة...';

            setTimeout(() => {
                // إظهار المحفظة وإخفاء نموذج الدخول
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('wallet-section').style.display = 'block';
                document.getElementById('user-display').innerText = user;
                document.getElementById('balance-display').innerText = '10.00'; // رصيد تجريبي افتراضي جاهز
                status.innerText = '';
            }, 500);
        }

        function logoutWallet() {
            document.getElementById('wallet-section').style.display = 'none';
            document.getElementById('auth-box').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('status-msg').innerText = 'تم تسجيل الخروج بنجاح.';
        }
    </script>
</body>
</html>
