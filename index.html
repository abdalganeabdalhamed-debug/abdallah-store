<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الله قرينان - متجر الشحن</title>
    <!-- مكتبة Supabase للربط -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #38ef7d;
        }

        /* --- نماذج الدخول وإنشاء الحساب --- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #38ef7d;
        }

        input[type="tel"] {
            direction: ltr;
            text-align: right;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #38ef7d;
            color: #38ef7d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: rgba(56, 239, 125, 0.1);
        }

        .forgot-link {
            display: block;
            margin-top: 12px;
            color: #aaa;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .forgot-link:hover {
            color: #38ef7d;
            text-decoration: underline;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .success-msg {
            color: #38ef7d;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        /* --- الصفحة الثانية: المتجر والمحفظة --- */
        #store-page {
            display: none;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #111;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: right;
        }

        .wallet-title {
            font-size: 14px;
            opacity: 0.8;
        }

        .wallet-balance {
            font-size: 28px;
            margin: 8px 0;
        }

        .btn-deposit {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        .store-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .store-item {
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .tiktok-svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .item-details {
            text-align: right;
        }

        .item-title {
            font-size: 16px;
            font-weight: bold;
        }

        .item-price {
            font-size: 13px;
            color: #aaa;
        }

        .btn-charge {
            background-color: #38ef7d;
            color: #111;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* نافذة التيك توك المحدثة */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 90%;
            max-width: 400px;
            text-align: right;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .coin-btn {
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }

        .coin-btn.active {
            border-color: #38ef7d;
            background-color: rgba(56, 239, 125, 0.15);
            color: #38ef7d;
            font-weight: bold;
        }

        .total-price-box {
            background-color: #2b2b2b;
            border: 1px solid #38ef7d;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #38ef7d;
            margin: 15px 0;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-cancel {
            background-color: #555;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 50%;
            cursor: pointer;
        }

        .btn-confirm {
            background-color: #38ef7d;
            color: #111;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        /* صفحة إضافة الرصيد الجديدة */
        #deposit-page {
            display: none;
            text-align: right;
        }

        .bank-info-box {
            background-color: #2b2b2b;
            border: 1px dashed #38ef7d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.8;
        }

        .social-btns {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-social {
            display: block;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .btn-wa { background-color: #25D366; }
        .btn-fb { background-color: #1877F2; }
